<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UIKI MODS</title>
      <style>
body {
    color: white;
}

h1, h2, h3, h4, h5, h6, p, span, li, label {
    color: white;
}
</style>

    <style>
body {
    background-color: #0a0a0a;
}
    </style>
    <style>
* {
    box-sizing: border-box;
}

.site-header {
    background: #111827;
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 1000;
}

.site-logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
}

.site-brand {
    flex: 1;
    min-width: 0;
}

.site-brand h1 {
    margin: 0;
    font-size: clamp(20px, 5vw, 36px);
    font-weight: 800;
    letter-spacing: -1px;
    background: linear-gradient(90deg, #00ff87, #00c6ff, #a78bfa);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.site-brand p {
    margin: 4px 0 0;
    font-size: 15px;
    color: #d1d5db;
}

.search-open {
    background: transparent;
    border: 0;
    color: white;
    font-size: 32px;
    cursor: pointer;
    padding: 5px;
}

.search-panel {
    display: none;
    background: #111827;
    color: white;
    padding: 18px;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    box-shadow: 0 12px 25px #0005;
    border-top: 1px solid #374151;
}

.search-panel.active {
    display: block;
}

.search-row {
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-row input {
    flex: 1;
    min-width: 0;
    padding: 13px 16px;
    border: 1px solid #4b5563;
    border-radius: 30px;
    outline: none;
    background: #1f2937;
    color: white;
    font-size: 16px;
}

.search-row input::placeholder {
    color: #9ca3af;
}

.search-close {
    background: transparent;
    color: white;
    border: 0;
    font-size: 30px;
    cursor: pointer;
    padding: 4px;
}

.recent-title {
    margin: 25px 0 12px;
    font-size: 17px;
    font-weight: 700;
    color: white;
}

.recent-searches {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.recent-searches button {
    background: #1f2937;
    border: 1px solid #374151;
    border-radius: 20px;
    color: #e5e7eb;
    padding: 8px 12px;
    cursor: pointer;
}

.search-results {
    margin-top: 15px;
    color: white;
}
</style>
</head>
<body>
    <header class="site-header">
    <!-- Yahan apni green G picture ka path add kero -->
    <img class="site-logo" src="Yahan apni green G picture ka path add kero" alt="UIKIMODSAPK Logo"><div class="site-brand">
    <h1>UIKIMODSAPK</h1>
    <p><span style="color:#00ff87">Download</span> &amp; <span style="color:#00c6ff">Enjoy</span></p>
</div>

<button class="search-open" id="openSearch" aria-label="Open search">⌕</button>

<div class="search-panel" id="searchPanel">
    <div class="search-row">
        <input type="search" id="siteSearch" placeholder="Search apps, games..." autocomplete="off">
        <button class="search-close" id="closeSearch" aria-label="Close search">×</button>
    </div>

    <h3 class="recent-title">Recent Searches</h3>
    <div class="recent-searches" id="recentSearches"></div>
    <div class="search-results" id="searchResults"></div>
</div>

</header>

  <h1> UIKI MODS </h1>

</body>
</html>
